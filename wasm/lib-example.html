<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WASM Binary Loader</title>

</head>

<body>
  <h1>Running WebAssembly</h1>
  <button id="run">Run WASM</button>


  <script type="module">
    import {getModelInfo, getEmbeddings} from "./utils.js";

    const bertWorker = new Worker("bertWorker.js", {
      type: "module",
    });

    // Update the progress bar based on the worker's status

    document.querySelector("#run").addEventListener("click", async () => {
      const modelID = "sentence_transformers_all_MiniLM_L6_v2";
      const query = "This is a query";
      const {modelURL, tokenizerURL, configURL, search_prefix} = getModelInfo(modelID);

      const out = await getEmbeddings(
        bertWorker,
        modelURL,
        tokenizerURL,
        configURL,
        modelID,
        [query],
      );

      console.log(`got embeddings: ${out}`);
    });

  </script>
</body>

</html>
