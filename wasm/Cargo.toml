[package]
name = "wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candle-core = "0.8.3"
candle-nn = "0.8.3"
candle-transformers = "0.8.3"
serde = { workspace=true }
serde_json = { workspace=true }
# Must use this version with default_features off otherwise the build will fail
tokenizers = { version = "0.19.0", default-features=false, features = ["unstable_wasm"] }

console_error_panic_hook = "0.1.7"
getrandom = { version = "0.2", features = ["js"] }
gloo = "0.11"
js-sys = "0.3.64"
wasm-bindgen = "0.2.87"
serde-wasm-bindgen = "0.6.0"

